name: EGL CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Check shell and KDE asset syntax
        run: |
          bash -n bootstrap.sh install.sh
          python -m json.tool kde/kwin/eglwindowguard/metadata.json >/dev/null
          node --check kde/kwin/eglwindowguard/contents/code/main.js
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Import runtime and GUI modules
        run: |
          python - <<'PY'
          import playwright
          import vosk
          import sounddevice
          import PySide6
          import egl.gui
          import egl.integration
          print("runtime imports OK")
          PY
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q src tests

  chromium-cdp-smoke:
    name: Permanent hidden Chromium/Xvfb smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install Xvfb and EGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Locate system Chrome
        run: |
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BROWSER"
          echo "EGL_BROWSER=$BROWSER" >> "$GITHUB_ENV"
          echo "Using $BROWSER"
      - name: Launch Chromium on EGL private Xvfb and attach through CDP
        run: |
          python - <<'PY'
          import os
          import tempfile
          from pathlib import Path
          from egl.browser import ChatGPTBrowser, find_system_browser, find_xvfb

          assert find_system_browser(), os.environ.get("EGL_BROWSER")
          assert find_xvfb()
          with tempfile.TemporaryDirectory() as td:
              browser = ChatGPTBrowser(
                  Path(td) / "profile",
                  "data:text/html,<title>EGL hidden smoke</title><h1>ok</h1>",
                  headless=True,
                  virtual_display=True,
              )
              browser.open()
              try:
                  assert browser.page is not None
                  assert browser.page.title() == "EGL hidden smoke"
                  assert browser.is_running()
              finally:
                  browser.close()
          print("permanent hidden Chromium/Xvfb smoke OK")
          PY
