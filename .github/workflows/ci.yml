name: EGL CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Check shell syntax
        run: bash -n bootstrap.sh install.sh
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Import runtime dependencies
        run: |
          python - <<'PY'
          import playwright
          import vosk
          import sounddevice
          import PySide6
          print("runtime imports OK")
          PY
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q src tests

  chromium-smoke:
    name: Playwright Chromium smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install EGL and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m playwright install --with-deps chromium
      - name: Launch persistent Chromium
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          with tempfile.TemporaryDirectory() as td, sync_playwright() as p:
              browser = p.chromium.launch_persistent_context(
                  user_data_dir=str(Path(td) / "profile"),
                  headless=True,
              )
              page = browser.pages[0] if browser.pages else browser.new_page()
              page.goto("data:text/html,<title>EGL smoke</title><h1>ok</h1>")
              assert page.title() == "EGL smoke"
              browser.close()
          print("Chromium persistent-context smoke OK")
          PY
