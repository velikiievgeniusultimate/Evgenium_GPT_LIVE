name: EGL CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Check shell syntax
        run: bash -n bootstrap.sh install.sh
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Import runtime dependencies
        run: |
          python - <<'PY'
          import playwright
          import vosk
          import sounddevice
          import PySide6
          print("runtime imports OK")
          PY
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q src tests

  chromium-cdp-smoke:
    name: System Chromium CDP smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install EGL
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Locate system Chrome
        run: |
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BROWSER"
          echo "EGL_BROWSER=$BROWSER" >> "$GITHUB_ENV"
          echo "Using $BROWSER"
      - name: Launch normal browser and attach through CDP
        run: |
          xvfb-run -a python - <<'PY'
          import os
          import tempfile
          from pathlib import Path
          from egl.browser import ChatGPTBrowser, find_system_browser

          assert find_system_browser(), os.environ.get("EGL_BROWSER")
          with tempfile.TemporaryDirectory() as td:
              browser = ChatGPTBrowser(
                  Path(td) / "profile",
                  "data:text/html,<title>EGL CDP smoke</title><h1>ok</h1>",
                  headless=False,
              )
              browser.open()
              try:
                  assert browser.page is not None
                  assert browser.page.title() == "EGL CDP smoke"
              finally:
                  browser.close()
          print("system Chromium CDP smoke OK")
          PY
